name: Refresh

# Fires hourly; v2/should_refresh.py decides whether this hour is one of the
# moments worth rebuilding for — about 24 hours before the next deadline (odds
# are out, pressers still to come), about 2 hours before it (last word), and a
# guaranteed Thursday-morning refresh for blank weeks and international breaks.
# Every other hour exits in seconds. Runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run the cheap news scan or a full model rebuild'
        type: choice
        options: [full, news]
        default: full
      tune:
        description: 'Also re-tune the team-model half-life (slow, ~10 min)'
        type: boolean
        default: false

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
      gw: ${{ steps.gate.outputs.gw }}
      hours: ${{ steps.gate.outputs.hours }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            v2/should_refresh.py
            data/last_refresh.json
          sparse-checkout-cone-mode: false
      - id: gate
        run: python3 v2/should_refresh.py
        env:
          INPUT_MODE: ${{ inputs.mode }}

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan public first-party team news
        id: news
        run: python3 -m v2.news_pipeline --summary /tmp/news-summary.json

      - name: Install full-model dependencies
        if: (needs.gate.outputs.mode == 'full' || steps.news.outputs.rebuild_required == 'true') && steps.news.outputs.official_fpl_ok == 'true'
        run: pip install --quiet numpy scipy pulp highspy

      - name: Pull fresh data
        if: (needs.gate.outputs.mode == 'full' || steps.news.outputs.rebuild_required == 'true') && steps.news.outputs.official_fpl_ok == 'true'
        # Full fetch, including the four-season player histories. The database is
        # not committed, so every CI run starts empty — skipping histories here
        # would leave season_stat blank and silently drop every player back to
        # the price prior. It is ~572 requests and about 90 seconds.
        run: python v2/fetch.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Rebuild the model
        if: (needs.gate.outputs.mode == 'full' || steps.news.outputs.rebuild_required == 'true') && steps.news.outputs.official_fpl_ok == 'true'
        run: |
          if [ "${{ inputs.tune }}" = "true" ]; then
            python v2/teams_model.py --tune
          else
            python v2/teams_model.py
          fi
          python v2/season_view.py
          python v2/player_model.py
          python v2/to_csv.py

      - name: Re-optimise squads
        if: (needs.gate.outputs.mode == 'full' || steps.news.outputs.rebuild_required == 'true') && steps.news.outputs.official_fpl_ok == 'true'
        run: |
          python optimise.py --json
          python validate.py

      - name: Grade finished gameweeks and review the last one
        if: (needs.gate.outputs.mode == 'full' || steps.news.outputs.rebuild_required == 'true') && steps.news.outputs.official_fpl_ok == 'true'
        # Runs BEFORE the digest (P3): the scorecard only needs last week's
        # snapshot and the API, and the retrospective it feeds is what the
        # digest for the next gameweek renders. Both are idempotent and re-run
        # at T-24h and T-2h; bonus-dependent pieces are re-scored once FPL
        # marks the round data-checked. Neither touches a projection.
        run: |
          python v2/scorecard.py
          python v2/retro.py

      - name: Digest, snapshot, price log
        if: (needs.gate.outputs.mode == 'full' || steps.news.outputs.rebuild_required == 'true') && steps.news.outputs.official_fpl_ok == 'true'
        # --team reads your real squad once picks are public (after GW1's
        # deadline); before that weekly.py falls back to v2/my_squad.txt.
        # FPL_ENTRY_ID is a repository *variable* (Settings → Secrets and
        # variables → Actions → Variables), not a secret — it is not sensitive.
        # ODDS_API_PLAYER_PROPS opts the snapshot into anytime-scorer props
        # (P8.2, shadow-only): set the repository variable to 1 once the key's
        # plan is known to include player props.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_PLAYER_PROPS: ${{ vars.ODDS_API_PLAYER_PROPS }}
        run: |
          TEAM_ARG=""
          if [ -n "${{ vars.FPL_ENTRY_ID }}" ]; then TEAM_ARG="--team ${{ vars.FPL_ENTRY_ID }}"; fi
          python v2/weekly.py --no-refresh --plan --chips --snapshot --price-log --push-file --json $TEAM_ARG
          python v2/movers.py

      - name: Export for the app
        if: (needs.gate.outputs.mode == 'full' && steps.news.outputs.official_fpl_ok == 'true') || steps.news.outputs.state_changed == 'true'
        run: python export_app_data.py

      - name: Record this refresh
        # api-unreachable means we never learned the real GW id; mark() resets
        # its done-list whenever gw changes, so marking GW0 would wipe the real
        # GW's record and let the next window rerun a completed rebuild.
        if: needs.gate.outputs.mode == 'full' && steps.news.outputs.official_fpl_ok == 'true' && needs.gate.outputs.reason != 'api-unreachable'
        run: python v2/should_refresh.py mark "${{ needs.gate.outputs.reason }}" "${{ needs.gate.outputs.gw }}"

      - name: Commit if anything changed
        if: (needs.gate.outputs.mode == 'full' && steps.news.outputs.official_fpl_ok == 'true') || steps.news.outputs.state_changed == 'true'
        run: |
          git config user.name  "fpl-bot"
          git config user.email "actions@github.com"
          git add data/ app/src/data/ v2/team_ratings.json v2/season_view.json \
                  v2/projections_v2.json v2/digest.md v2/availability.generated.json \
                  v2/player_aliases.json
          # the frozen calibration (P4) exists only after the first full
          # rebuild; an unmatched pathspec would fail the news-mode commit
          if [ -f v2/calibration.json ]; then git add v2/calibration.json; fi
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Refresh (${{ needs.gate.outputs.reason }}, GW${{ needs.gate.outputs.gw }}): $(date -u +%Y-%m-%d\ %H:%M)"
            git pull --rebase --autostash origin master
            git push
          fi

      - name: Push the digest to your phone
        # ntfy.sh needs no account: subscribe to the topic in the ntfy app and
        # every deadline-window refresh lands as a notification. NTFY_TOPIC is a
        # repository secret. Only the deadline windows and manual runs push —
        # Thursday's routine refresh would just be noise.
        #
        # Commit first: it is the durable artefact; this push is derived output.
        # continue-on-error keeps a flaky ntfy from failing the job after a
        # rebuild already succeeded, and api-unreachable never pushes (the gate
        # never learned the real GW id, so the title would read GW0).
        if: needs.gate.outputs.reason != 'weekly' && needs.gate.outputs.reason != 'api-unreachable' && ((needs.gate.outputs.mode == 'full' && steps.news.outputs.official_fpl_ok == 'true') || steps.news.outputs.notify_required == 'true')
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is not configured; notification skipped."
          else
          PRIORITY="default"
          if [ "${{ steps.news.outputs.urgent }}" = "true" ]; then PRIORITY="urgent"; fi
          PUSH_FILE="v2/push.txt"
          if { [ "${{ needs.gate.outputs.mode }}" = "news" ] && [ "${{ steps.news.outputs.rebuild_required }}" != "true" ]; } || [ "${{ steps.news.outputs.official_fpl_ok }}" != "true" ]; then
            PUSH_FILE="v2/news_push.txt"
          fi
          UPDATE_ID="gw${{ needs.gate.outputs.gw }}-${{ needs.gate.outputs.reason }}-${{ steps.news.outputs.notification_key }}"
          if curl -fsS "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=24h" | \
              python3 -c 'import json,sys; k=sys.argv[1]; found=any(k in (json.loads(line).get("message") or "") for line in sys.stdin if line.strip()); raise SystemExit(0 if found else 1)' "$UPDATE_ID"; then
            echo "notification already delivered; skipping duplicate"
          else
            { cat "$PUSH_FILE"; printf '\nUpdate ID: %s\n' "$UPDATE_ID"; } | curl -fsS \
              -H "Title: FPL GW${{ needs.gate.outputs.gw }} · ${{ needs.gate.outputs.reason }}" \
              -H "Click: https://fpl-2026.vercel.app" \
              -H "Tags: soccer" \
              -H "Priority: $PRIORITY" \
              --data-binary @- \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
            echo "pushed to ntfy topic"
          fi
          fi

      - name: Fail visibly when official FPL is stale
        if: steps.news.outputs.official_fpl_ok != 'true'
        run: |
          echo "Official FPL bootstrap or fixtures were unavailable; cached data was not allowed to rebuild the model."
          exit 1

      - name: Ping healthcheck
        if: always()
        # Dead-man's switch for external monitoring (healthchecks.io or any
        # compatible service): success pings the base URL, anything else pings
        # /fail so the monitor alerts immediately instead of waiting out its
        # grace period. Optional feature: an unset secret is a silent no-op,
        # and a monitoring outage never fails the build.
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret not configured; skipping ping."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            curl -fsS --max-time 10 "$HEALTHCHECK_URL" > /dev/null || true
          else
            curl -fsS --max-time 10 "$HEALTHCHECK_URL/fail" > /dev/null || true
          fi
